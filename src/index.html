<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="/main.js" defer></script>
    <title>Kiko</title>
  </head>
  <body>
    <main class="container">
      <h1>Kiko</h1>
      <p id="now">Файл не выбран</p>

      <div class="progress">
        <span id="cur">0:00</span>
        <input id="seek" type="range" min="0" max="1" step="0.1" value="0" disabled />
        <span id="dur">0:00</span>
      </div>

      <div class="volume">
        <span>Громкость</span>
        <input id="vol" type="range" min="0" max="100" value="100" />
      </div>

      <button id="open">Выбрать файл</button>
      <button id="toggle">Пауза</button>
      <button id="stop">Стоп</button>
    </main>
  </body>
</html>
