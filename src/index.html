<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
  <title>Kiko</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
  /* Layout: one glass window floating over a blurred-cover fog.
     Queue panel on the left, now-playing stage on the right,
     transport bar along the bottom: seek | controls | volume. */
  :root{
    --bg:#080b0a; --ink:#e9efe9; --ink-2:#a3b1a9; --ink-3:#6f7e76;
    --glass:rgba(12,17,15,.46); --glass-2:rgba(0,0,0,.38); --line:rgba(220,240,230,.11);
    --accent:#e3a95f; --accent-ink:#1a1206; --fog:#5f8a7a; --danger:#e07a6a;
    --display:'Unbounded','Segoe UI',system-ui,sans-serif;
    --body:'Manrope',system-ui,'Segoe UI',sans-serif;
    --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--body);
    padding-block:16px;
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));
    overflow:hidden}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
  
  /* background: blurred cover, drifting fog, grain, vignette */
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--bg)}
  .art{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.2s ease}
  .art.on{opacity:.9}
  .fog{position:absolute;inset:0;
    background:
    radial-gradient(40% 30% at 25% 70%,rgba(95,138,122,.30),transparent 70%),
    radial-gradient(35% 28% at 75% 30%,rgba(140,170,160,.18),transparent 70%),
    radial-gradient(30% 25% at 55% 92%,rgba(227,169,95,.13),transparent 70%)}
    .grain{position:absolute;inset:0;opacity:.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
  .vig{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 40%,transparent 35%,rgba(0,0,0,.72))}
  
  /* window */
  .win{position:relative;z-index:1;height:100%;max-width:1240px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding:14px;
    border-radius:18px;background:rgba(6,9,8,.45);border:1px solid var(--line)}
  .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .brand{display:flex;align-items:baseline;gap:14px;font:600 20px/1 var(--display);letter-spacing:.16em;text-transform:uppercase}
  .sum{font:400 12px var(--mono);letter-spacing:.02em;color:var(--ink-3);text-transform:none}
  .sp{flex:1}
  .warn{font-size:12px;color:var(--accent);border:1px solid rgba(227,169,95,.35);border-radius:999px;padding:4px 10px}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;background:var(--glass-2);border:1px solid var(--line);font-weight:600;transition:background .2s,filter .2s}
  .btn:hover{background:rgba(255,255,255,.09)}
  .btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
  .btn.pri:hover{background:var(--accent);filter:brightness(1.08)}
  
  .main{display:grid;grid-template-columns:minmax(280px,380px) minmax(0,1fr);gap:12px;min-height:0}
  .panel{min-height:0;min-width:0;background:var(--glass-2);border:1px solid var(--line);border-radius:16px}
  
  /* queue */
  .queue{display:flex;flex-direction:column;overflow:hidden}
  .qhead{padding:10px 10px 4px}
  .search{display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--ink-3)}
  .search input{flex:1;min-width:0;height:38px;background:none;border:0;outline:0;color:var(--ink);font:inherit}
  .search input::placeholder{color:var(--ink-3)}
  .search:focus-within{border-color:rgba(227,169,95,.5)}
  .list{list-style:none;margin:0;padding:6px;overflow-y:auto;flex:1;min-height:0;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
  .row{display:flex;align-items:center;border-radius:12px;transition:background .15s}
  .row:hover{background:rgba(255,255,255,.06)}
  .row.cur{background:rgba(227,169,95,.11)}
  .row-main{flex:1;min-width:0;display:grid;grid-template-columns:26px 40px minmax(0,1fr) auto;align-items:center;gap:10px;padding:7px 8px;text-align:left}
  .idx{display:grid;place-items:center;height:16px;font:400 12px var(--mono);color:var(--ink-3)}
  .thumb{width:40px;height:40px;border-radius:8px;background-size:cover;background-position:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.09)}
  .rt{min-width:0;display:flex;flex-direction:column}
  .rt b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rt i{font-style:normal;font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row.cur .rt b{color:var(--accent)}
  .dur{font:400 12px var(--mono);color:var(--ink-3)}
  .row-x{width:30px;height:30px;margin-right:6px;border-radius:8px;display:grid;place-items:center;color:var(--ink-3);opacity:0;transition:opacity .15s,color .15s}
  .row-x .ic{width:16px;height:16px}
  .row:hover .row-x,.row-x:focus-visible{opacity:1}
  .row-x:hover{color:var(--danger)}
  @media (hover:none){.row-x{opacity:1}}
  .eq{display:none;gap:2px;align-items:flex-end;height:14px}
  .eq span{width:3px;height:100%;transform-origin:bottom;transform:scaleY(.3);background:var(--accent);border-radius:1px;animation:eq .9s ease-in-out infinite alternate}
  .eq span:nth-child(2){animation-delay:-.3s}.eq span:nth-child(3){animation-delay:-.6s}
  @keyframes eq{to{transform:scaleY(1)}}
  .row.cur.playing .idx-n{display:none}
  .row.cur.playing .eq{display:flex}
  .qnone{padding:28px 18px;text-align:center;color:var(--ink-3)}
  .qnone b{display:block;color:var(--ink-2);font-weight:600;margin-bottom:4px}
  .qfoot{padding:8px 14px 10px;border-top:1px solid var(--line);display:flex;justify-content:flex-end}
  .link{font-size:12px;color:var(--ink-3);transition:color .15s}
  .link:hover{color:var(--ink)}
  .link.danger{color:var(--danger)}
  
  /* stage */
  .stage{display:grid;grid-template-rows:minmax(0,1fr);padding:22px;overflow:hidden}
  .stage-in{display:grid;grid-template-columns:34px minmax(0,1fr);gap:18px;min-height:0}
  .vtitle{writing-mode:vertical-rl;transform:rotate(180deg);align-self:stretch;justify-self:center;min-height:0;max-height:100%;
    font:300 13px var(--display);letter-spacing:.5em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .col{display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0;min-width:0}
  .cwrap{container-type:size;display:grid;place-items:center;min-height:0}
  .cover{width:min(100cqw,100cqh);height:min(100cqw,100cqh);border-radius:20px;background-size:cover;background-position:center;display:grid;place-items:center;
    box-shadow:0 30px 70px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08)}
  .cover .mono{font:300 clamp(48px,12cqmin,120px)/1 var(--display);color:rgba(255,255,255,.28)}
  .meta{padding-top:18px;min-width:0}
  .meta h1{margin:0 0 6px;font:600 clamp(20px,2.6vw,30px)/1.18 var(--display);overflow-wrap:anywhere;text-wrap:balance;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .meta p{margin:0;color:var(--ink-2)}
  .meta .alb{margin-top:2px;font-size:12px;color:var(--ink-3)}
  .empty{display:grid;place-content:center;justify-items:center;gap:14px;text-align:center;padding:32px;border:1.5px dashed rgba(255,255,255,.17);border-radius:18px}
  .empty h2{margin:0;font:400 clamp(18px,2.4vw,26px)/1.25 var(--display);text-wrap:balance}
  .empty p{margin:0;max-width:44ch;color:var(--ink-2)}
  .empty small{color:var(--ink-3);font-size:12px}
  
  /* transport bar */
  .bar{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:18px;padding:10px 18px;border-radius:16px;background:var(--glass-2);border:1px solid var(--line)}
  .seekbox{display:grid;grid-template-columns:auto minmax(60px,1fr) auto;align-items:center;gap:10px;font:400 12px var(--mono);color:var(--ink-2);font-variant-numeric:tabular-nums}
  .ctrls{display:flex;align-items:center;gap:6px}
  .ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);transition:color .15s,background .15s,transform .15s}
  .ib:hover{color:var(--ink);background:rgba(255,255,255,.09)}
  .ib[aria-pressed="true"]{color:var(--accent)}
  .ib.play{width:54px;height:54px;background:var(--ink);color:#0a0d0c;margin-inline:4px}
  .ib.play:hover{background:#fff;transform:scale(1.06)}
  .ib.play .ic{width:24px;height:24px}
  .vol{display:grid;grid-template-columns:auto minmax(60px,150px);justify-content:end;align-items:center;gap:6px}
  
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;margin:0;background:transparent;cursor:pointer;--p:0%}
  input[type=range]:disabled{cursor:default;opacity:.5}
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(to right,var(--accent) var(--p),rgba(255,255,255,.17) var(--p))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;border-radius:50%;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.5);transition:transform .12s}
  input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.2)}
  input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:rgba(255,255,255,.17)}
  input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:var(--accent)}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff}
  
  /* overlays */
  .toast{position:absolute;left:50%;bottom:104px;transform:translate(-50%,8px);max-width:min(92%,460px);padding:9px 16px;border-radius:999px;background:rgba(10,14,12,.88);border:1px solid var(--line);font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:6;text-align:center}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .veil{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px;text-align:center;background:rgba(5,8,7,.8);font:400 22px var(--display);opacity:0;pointer-events:none;transition:opacity .2s}
  .veil.on{opacity:1}
  
  /* narrow screens */
  @media (max-width:860px){
    .main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
    .stage{order:-1;padding:12px}
    .stage-in{grid-template-columns:minmax(0,1fr)}
    .vtitle{display:none}
    .col{grid-template-rows:none;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:center}
    .cwrap{height:96px}
    .cover{border-radius:14px}
    .meta{padding-top:0}
    .meta h1{font-size:18px}
    .empty{padding:16px;gap:8px}
    .empty small{display:none}
  }
  @media (max-width:720px){
    .win{padding:10px;gap:10px}
    .bar{grid-template-columns:minmax(0,1fr);gap:4px;padding:8px 12px}
    .ctrls{justify-content:center}
    .vol{display:none}
    .btn .lbl{display:none}
    .toast{bottom:150px}
  }
  @media (prefers-reduced-motion:reduce){
    .eq span{animation:none}
    .art{transition:none}
  }
  </style>

  <div class="bg" aria-hidden="true"><div class="art" id="artA"></div><div class="art" id="artB"></div><div class="fog"></div><div class="grain"></div><div class="vig"></div></div>
  
  <div class="win" id="win">
    <header class="top" data-tauri-drag-region>
      <div class="brand" data-tauri-drag-region>Kiko <span class="sum" id="sum" data-tauri-drag-region></span></div>
      <span class="warn" id="warn" hidden>Браузер не даёт сохранять треки: после перезагрузки очередь пропадёт</span>
      <span class="sp" data-tauri-drag-region></span>
      <button class="btn pri" id="addBtn" type="button"><svg class="ic"><use href="#i-plus"/></svg><span class="lbl">Добавить mp3</span></button>
    </header>
  
    <div class="main">
      <aside class="panel queue" aria-label="Очередь">
        <div class="qhead"><label class="search"><svg class="ic"><use href="#i-search"/></svg><input id="search" type="search" placeholder="Поиск по очереди" autocomplete="off" aria-label="Поиск по очереди"></label></div>
        <ul class="list" id="list"></ul>
        <div class="qfoot" id="qfoot" hidden><button class="link" id="clearBtn" type="button">Очистить очередь</button></div>
      </aside>
  
      <section class="panel stage" aria-label="Сейчас играет">
        <div class="empty" id="empty">
          <h2>Перетащи сюда mp3-файлы</h2>
          <p>Треки, очередь, громкость и место в песне запоминаются в этом браузере. Закрыл вкладку, открыл снова, и можно продолжать.</p>
          <button class="btn pri" id="addBtn2" type="button"><svg class="ic"><use href="#i-plus"/></svg><span>Выбрать файлы</span></button>
          
        </div>
        <div class="stage-in" id="stageIn" hidden>
          <div class="vtitle" id="vtitle" aria-hidden="true"></div>
          <div class="col">
            <div class="cwrap"><div class="cover" id="cover"></div></div>
            <div class="meta"><h1 id="nTitle"></h1><p id="nArtist"></p><p class="alb" id="nAlbum"></p></div>
          </div>
        </div>
      </section>
    </div>
  
    <footer class="bar">
      <div class="seekbox">
        <span id="tCur">0:00</span>
        <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Перемотка" disabled>
        <span id="tTot">0:00</span>
      </div>
      <div class="ctrls">
        <button class="ib" id="shuf" type="button" aria-pressed="false" aria-label="Перемешать (S)" title="Перемешать (S)"><svg class="ic"><use href="#i-shuffle"/></svg></button>
        <button class="ib" id="prev" type="button" aria-label="Предыдущий (Z)" title="Предыдущий (Z)"><svg class="ic"><use href="#i-prev"/></svg></button>
        <button class="ib play" id="play" type="button" aria-label="Играть / пауза (пробел)" title="Играть / пауза (пробел)"><svg class="ic" id="playIc"><use href="#i-play"/></svg></button>
        <button class="ib" id="next" type="button" aria-label="Следующий (B)" title="Следующий (B)"><svg class="ic"><use href="#i-next"/></svg></button>
        <button class="ib" id="rep" type="button" aria-pressed="false" aria-label="Повтор (R)" title="Повтор: выкл (R)"><svg class="ic" id="repIc"><use href="#i-repeat"/></svg></button>
      </div>

        <button class="ib" id="mute" type="button" aria-label="Без звука (M)" title="Без звука (M)"><svg class="ic" id="muteIc"><use href="#i-vol"/></svg></button>
        <input id="vol" type="range" min="0" max="100" value="80" step="1" aria-label="Громкость">

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  
  </div>

  <input type="file" id="picker" accept=".mp3,audio/mpeg" multiple hidden>
  <audio id="audio" preload="metadata"></audio>
  
  <script>
  (() => {
  'use strict';
  const $ = s => document.querySelector(s);
  const audio = $('#audio'), list = $('#list'), seek = $('#seek'), vol = $('#vol'), picker = $('#picker');
  const search = $('#search'), clearBtn = $('#clearBtn');
  
  const S = {
    tracks: new Map(), order: [], cur: null, time: 0, pendingSeek: null,
    shuffle: false, repeat: 'off', volume: 0.8, muted: false,
    history: [], filter: '', seeking: false
  };
  let db = null, curUrl = null, loadToken = 0, lastBg = null, artFlip = false;
  
  /* ---------- helpers ---------- */
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'k' + Date.now().toString(36) + Math.random().toString(36).slice(2, 9));
  const cur = () => S.tracks.get(S.cur) || null;
  const pad2 = n => String(n).padStart(2, '0');
  const plural = (n, f) => { const a = n % 10, b = n % 100; return f[(b > 10 && b < 20) ? 2 : a === 1 ? 0 : (a >= 2 && a <= 4) ? 1 : 2]; };
  function fmt(s) {

  function bindMedia() {
    if (!('mediaSession' in navigator)) return;
    const set = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch {} };
    set('play', () => { if (audio.paused) toggle(); });
    set('pause', () => audio.pause());
    set('previoustrack', prev); set('nexttrack', next);
    set('seekbackward', () => seekBy(-10)); set('seekforward', () => seekBy(10));
    set('seekto', d => { if (d && typeof d.seekTime === 'number') seekTo(d.seekTime); });
  }
  
  /* ---------- UI wiring ---------- */
  function bindUI() {
    $('#addBtn').onclick = $('#addBtn2').onclick = () => picker.click();
    picker.addEventListener('change', () => { if (picker.files.length) addFiles(picker.files); picker.value = ''; });
    $('#play').onclick = toggle; $('#prev').onclick = prev; $('#next').onclick = next;
    $('#shuf').onclick = toggleShuffle; $('#rep').onclick = cycleRepeat; $('#mute').onclick = toggleMute;
  
    seek.addEventListener('input', () => { S.seeking = true; paintRange(seek); updateSeek(); });
    seek.addEventListener('change', () => {
      const d = curDur(); S.seeking = false;
      if (d) seekTo(seek.value / 1000 * d); else updateSeek();
      saveState(true); seek.blur();
    });
    vol.addEventListener('input', () => { S.volume = vol.value / 100; S.muted = false; applyVolume(); saveState(true); });
    vol.addEventListener('change', () => vol.blur());
  
    list.addEventListener('click', e => {
      const b = e.target.closest('[data-act]'); if (!b) return;
      const id = b.closest('.row').dataset.id;
      if (b.dataset.act === 'del') removeTrack(id); else playId(id);
      if (b.dataset.act === 'play') b.blur();
    });
    search.addEventListener('input', () => { S.filter = search.value; renderList(); });
  
    let armed = 0;
    clearBtn.addEventListener('click', () => {
      if (!armed) {
        clearBtn.textContent = 'Точно удалить всё?'; clearBtn.classList.add('danger');
        armed = setTimeout(() => { armed = 0; clearBtn.textContent = 'Очистить очередь'; clearBtn.classList.remove('danger'); }, 3000);
        return;
      }
      clearTimeout(armed); armed = 0; clearBtn.textContent = 'Очистить очередь'; clearBtn.classList.remove('danger');
      clearAll(); toast('Очередь очищена');
    });
  
    /* drag and drop */
    const veil = $('#veil'); let dragN = 0;
    const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
    addEventListener('dragenter', e => { if (hasFiles(e)) { dragN++; veil.classList.add('on'); e.preventDefault(); } });
    addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
    addEventListener('dragleave', e => { if (hasFiles(e)) { dragN = Math.max(0, dragN - 1); if (!dragN) veil.classList.remove('on'); } });
    addEventListener('drop', e => { if (hasFiles(e)) { e.preventDefault(); dragN = 0; veil.classList.remove('on'); addFiles(e.dataTransfer.files); } });
  
    /* hotkeys: by physical key, so they work on the Russian layout too */
    const isTyping = el => { const tag = (el.tagName || '').toLowerCase(); return tag === 'textarea' || (tag === 'input' && el.type !== 'range' && el.type !== 'file'); };
    document.addEventListener('keydown', e => {
      if (isTyping(e.target)) {
        if (e.key === 'Escape') { e.target.value = ''; S.filter = ''; renderList(); e.target.blur(); }
        else if (e.key === 'Enter') { const r = list.querySelector('.row'); if (r) { playId(r.dataset.id); e.target.blur(); } }
        return;
      }
      if (e.metaKey || e.altKey) return;
      const c = e.code; let handled = true;
      if (e.ctrlKey) { if (c === 'ArrowRight') next(); else if (c === 'ArrowLeft') prev(); else handled = false; }
      else switch (c) {
        case 'Space': case 'KeyC': toggle(); break;
        case 'KeyX': playFromStart(); break;
        case 'KeyV': stop(); break;
        case 'KeyZ': prev(); break;
        case 'KeyB': next(); break;
        case 'ArrowLeft': seekBy(e.shiftKey ? -30 : -5); break;
        case 'ArrowRight': seekBy(e.shiftKey ? 30 : 5); break;
        case 'ArrowUp': setVol(0.05); break;
        case 'ArrowDown': setVol(-0.05); break;
        case 'KeyM': toggleMute(); break;
        case 'KeyS': toggleShuffle(); break;
        case 'KeyR': cycleRepeat(); break;
        case 'Slash': search.focus(); break;
        case 'KeyO': picker.click(); break;
        default: handled = false;
      }
      if (handled) e.preventDefault();
    });
    document.addEventListener('keyup', e => { if (e.code === 'Space' && !isTyping(e.target)) e.preventDefault(); });
  
    addEventListener('pagehide', () => saveState(true));
    document.addEventListener('visibilitychange', () => { if (document.hidden) saveState(true); });
  }
  
  /* ---------- start ---------- */
  async function init() {
    bindUI(); bindMedia();
    try { db = await openDB(); } catch { db = null; $('#warn').hidden = false; }
    if (db) {
      try {
        const metas = await idb(['meta'], 'readonly', tx => tx.objectStore('meta').getAll());
        (metas || []).sort((a, b) => a.added - b.added).forEach(m => { m.coverUrl = m.cover ? URL.createObjectURL(m.cover) : ''; S.tracks.set(m.id, m); });
      } catch {}
    }
    const st = await loadState();
    if (st) {
      S.volume = typeof st.volume === 'number' ? st.volume : 0.8;
      S.muted = !!st.muted; S.shuffle = !!st.shuffle;
      S.repeat = ['off', 'all', 'one'].includes(st.repeat) ? st.repeat : 'off';
    }
    const saved = st && Array.isArray(st.order) ? st.order.filter(id => S.tracks.has(id)) : [];
    const rest = [...S.tracks.values()].filter(t => !saved.includes(t.id)).sort((a, b) => a.added - b.added).map(t => t.id);
    S.order = saved.concat(rest);
    applyVolume(); renderAll();
    S.tracks.forEach(t => probe(t));
    if (S.order.length) {
      const id = st && st.cur && S.tracks.has(st.cur) ? st.cur : S.order[0];
      const time = st && st.cur === id ? (st.time || 0) : 0;
      await select(id, { play: false, time });
      const t = cur();
      if (t && time > 2) toast(`Продолжаем: «${t.title}», ${fmt(time)}`);
    }
  }
  init();
  })();
  </script>
  
  </body></html>
